apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recruitifi-ai-isolation
spec:
  podSelector:
    matchLabels:
      app: recruitifi-ai
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: recruitifi
              recruitifi.ai-client: 'true'
      ports:
        - protocol: TCP
          port: 8080
  # Model/tokenizer are in the image. The model needs no DNS or internet egress.
  egress: []
