# Optional strategic-merge patch. Do not apply until the new image is running.
# Existing passwords/signing/model Secrets remain referenced and are not deleted.
spec:
  template:
    spec:
      containers:
        - name: recruitifi
          env:
            - name: TALENTMATCH_PASSWORD_FREE_DEMO
              value: 'true'
            - name: TALENTMATCH_VERIFIED_DEMO_LOGIN
              value: '1'
            - name: TALENTMATCH_DEMO_AUTH_ENABLED
              value: 'false'
